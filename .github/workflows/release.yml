name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build XUnity.AutoLLMTranslator.csproj -c Release

      - name: Rename IL2CPP artifact
        # 双目标构建产出 net35(Mono) 与 net6.0(IL2CPP) 两个 DLL，
        # 重命名 net6.0 产物以避免与 Mono 版本混淆
        run: |
          Move-Item "bin/Release/net6.0/XUnity.AutoLLMTranslator.dll" "bin/Release/net6.0/XUnity.AutoLLMTranslator.IL2CPP.dll"
          Move-Item "bin/Release/net6.0/XUnity.AutoLLMTranslator.pdb" "bin/Release/net6.0/XUnity.AutoLLMTranslator.IL2CPP.pdb"

      - name: Upload Mono artifact
        uses: actions/upload-artifact@v7
        with:
          name: XUnity.AutoLLMTranslator-Mono
          path: bin/Release/net35/XUnity.AutoLLMTranslator.dll

      - name: Upload IL2CPP artifact
        uses: actions/upload-artifact@v7
        with:
          name: XUnity.AutoLLMTranslator-IL2CPP
          path: bin/Release/net6.0/XUnity.AutoLLMTranslator.IL2CPP.dll

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}"
          $mono = "bin/Release/net35/XUnity.AutoLLMTranslator.dll"
          $il2cpp = "bin/Release/net6.0/XUnity.AutoLLMTranslator.IL2CPP.dll"
          gh release view "$version" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$version" "$mono" "$il2cpp" --clobber
          } else {
            gh release create "$version" `
              --title "Release $version" `
              --generate-notes `
              "$mono" "$il2cpp"
          }
