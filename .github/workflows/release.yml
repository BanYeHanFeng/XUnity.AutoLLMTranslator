name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore NuGet packages
        run: dotnet restore XUnity.AutoLLMTranslator.sln

      - name: Build
        shell: pwsh
        run: |
          $gameDir = Join-Path $env:RUNNER_TEMP "GameOutput"
          New-Item -ItemType Directory -Force -Path $gameDir | Out-Null
          dotnet build XUnity.AutoLLMTranslator.sln -c Release --no-restore "/p:GameDir=$gameDir\"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
            gh release view "$version" 2>$null
            if ($LASTEXITCODE -eq 0) {
              gh release upload "$version" "bin/Release/net35/XUnity.AutoLLMTranslator.dll" --clobber
            } else {
              gh release create "$version" `
                --title "Release $version" `
                --generate-notes `
                "bin/Release/net35/XUnity.AutoLLMTranslator.dll"
            }
          } else {
            $date = Get-Date -Format 'yyyyMMdd'
            $shortHash = git rev-parse --short HEAD
            $version = "$date-$shortHash"
            gh release list --json tagName,isPrerelease | ConvertFrom-Json | Where-Object { $_.isPrerelease } | ForEach-Object { gh release delete $_.tagName --yes --cleanup-tag 2>$null }
            gh release create "$version" `
              --title "Pre-release $version" `
              --prerelease `
              --generate-notes `
              "bin/Release/net35/XUnity.AutoLLMTranslator.dll"
          }
