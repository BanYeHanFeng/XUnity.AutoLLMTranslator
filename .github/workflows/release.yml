name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore NuGet packages
        run: dotnet restore XUnity.AutoLLMTranslator.sln

      - name: Build
        shell: pwsh
        run: |
          $gameDir = Join-Path $env:RUNNER_TEMP "GameOutput"
          New-Item -ItemType Directory -Force -Path $gameDir | Out-Null
          dotnet build XUnity.AutoLLMTranslator.sln -c Release --no-restore "/p:GameDir=$gameDir\"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: XUnity.AutoLLMTranslator
          path: bin/Release/net35/XUnity.AutoLLMTranslator.dll

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          gh release view "$version" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$version" "bin/Release/net35/XUnity.AutoLLMTranslator.dll" --clobber
          } else {
            gh release create "$version" `
              --title "Release $version" `
              --generate-notes `
              "bin/Release/net35/XUnity.AutoLLMTranslator.dll"
          }
